[project]
name = "vir-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TNlucfer01", email = "ihdaa2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepface>=0.0.101",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "langchain-text-splitters>=1.1.2",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
vir-rag-assistant = "vir_rag_assistant:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
